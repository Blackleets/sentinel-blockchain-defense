name: SENTINEL CI

on:
  push:
    branches: [main, feat/evidence-confidence-engine, feat/arkham-live-visualizer]
  pull_request:
    branches: [main, feat/evidence-confidence-engine]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: npm run check
